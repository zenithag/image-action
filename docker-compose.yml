services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio_dev
      POSTGRES_DB: studio_app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.71.6
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "MustBeAtLeast32CharactersLongKey"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALDOMAIN: "localhost"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: studio
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: studio_dev
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: studio
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: studio_dev
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "cardoso.tads@gmail.com"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "Admin123!"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: "Wesley"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: "Cardoso"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL: "cardoso.tads@gmail.com"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    build:
      context: ./services/api-server
    ports:
      - "8000:8000"
    environment:
      database_url: postgresql://studio:studio_dev@postgres:5432/studio_app
      minio_endpoint: minio:9000
      minio_access_key: minioadmin
      minio_secret_key: minioadmin
      minio_secure: "false"
      minio_bucket: tenant-assets
      auth_enabled: "false"
      openrouter_api_key: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  composition-worker:
    build:
      context: ./services/composition-worker
    environment:
      database_url: postgresql://studio:studio_dev@postgres:5432/studio_app
      minio_endpoint: minio:9000
      minio_access_key: minioadmin
      minio_secret_key: minioadmin
      minio_secure: "false"
      minio_bucket_renders: tenant-renders
      api_server_url: http://api-server:8000
      openrouter_api_key: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      api-server:
        condition: service_started

  segmentation-service:
    build:
      context: ./services/segmentation-service
    ports:
      - "8010:8010"
    environment:
      SEGMENTATION_PROVIDER: ${SEGMENTATION_PROVIDER:-grounded_sam}
      SEGMENTATION_LOCAL_MODEL: ${SEGMENTATION_LOCAL_MODEL:-nvidia/segformer-b2-finetuned-ade-512-512}
      SEGMENTATION_GROUNDED_SAM_DETECTOR_MODEL: ${SEGMENTATION_GROUNDED_SAM_DETECTOR_MODEL:-IDEA-Research/grounding-dino-tiny}
      SEGMENTATION_GROUNDED_SAM_SEGMENTER_MODEL: ${SEGMENTATION_GROUNDED_SAM_SEGMENTER_MODEL:-facebook/sam-vit-base}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-idea-research/ram-grounded-sam}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-me
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://studio:studio_dev@postgres:5432/studio_app
      NODE_OPTIONS: --no-experimental-webstorage
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_started
      segmentation-service:
        condition: service_started

  app-job-worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: >
      sh -c "node apps/web/server.js &
      node apps/web/scripts/app-job-worker.mjs"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev-secret-change-me
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://studio:studio_dev@postgres:5432/studio_app
      NODE_OPTIONS: --no-experimental-webstorage
      SEGMENTATION_SERVICE_URL: ${SEGMENTATION_SERVICE_URL:-}
      HOSTNAME: "0.0.0.0"
      PORT: 3001
      APP_JOB_WORKER_URL: http://127.0.0.1:3001/api/internal/app-jobs/process
      APP_JOB_WORKER_TOKEN: dev-secret-change-me
      APP_JOB_WORKER_INTERVAL_SECONDS: ${APP_JOB_WORKER_INTERVAL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      segmentation-service:
        condition: service_started

volumes:
  pgdata:
  miniodata:
