name: Build and publish ComoFica

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: comofica-production-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once for web and worker
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zenithag/image-action:develop
            ghcr.io/zenithag/image-action:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zenithag/image-action
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://comofica.ai
            NEXT_PUBLIC_API_URL=https://comofica.ai
            NEXT_PUBLIC_WS_URL=https://comofica.ai
            NEXT_PUBLIC_ENABLE_WS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy web and worker after publishing
        env:
          WEB_HOOK: ${{ secrets.DOKPLOY_WEB_DEPLOY_WEBHOOK }}
          WORKER_HOOK: ${{ secrets.DOKPLOY_WORKER_DEPLOY_WEBHOOK }}
        run: |
          for hook in "$WEB_HOOK" "$WORKER_HOOK"; do
            if [ -z "$hook" ]; then
              echo '::notice::Dokploy webhook not configured; image published for manual deployment.'
              continue
            fi
            curl --fail --silent --show-error --output /dev/null \
              --connect-timeout 15 --max-time 60 \
              --header 'Content-Type: application/json' \
              --header 'User-Agent: Go-http-client/1.1' \
              --data '{"push_data":{"tag":"develop"},"repository":{"repo_name":"ghcr.io/zenithag/image-action"}}' \
              "$hook"
          done
